name: ci

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: dotnet test backend/SebPortal.Api.Tests/SebPortal.Api.Tests.csproj --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage"

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          FILE=$(find "${{ github.workspace }}" -name coverage.cobertura.xml -print -quit)
          if [ -n "$FILE" ]; then
            dotnet tool install -g dotnet-reportgenerator-globaltool
            reportgenerator -reports:"$FILE" -targetdir:"${{ github.workspace }}/coverage-report" -reporttypes:"Html;MarkdownSummaryGithub"
            cat "${{ github.workspace }}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore

      - name: Coverage gate
        shell: bash
        run: |
          FILE=$(find "${{ github.workspace }}" -name coverage.cobertura.xml -print -quit)
          if [ -z "$FILE" ]; then
            echo "No coverage.cobertura.xml found anywhere in the workspace"
            exit 1
          fi
          echo "Using $FILE"
          RATE=$(grep -m1 -o 'line-rate="[0-9.]*"' "$FILE" | grep -o '[0-9.]*')
          PCT=$(echo "$RATE * 100" | bc -l | xargs printf "%.1f")
          echo "### Backend line coverage: $PCT% (threshold 85%)" >> "$GITHUB_STEP_SUMMARY"
          if (( $(echo "$PCT < 85" | bc -l) )); then
            echo "Coverage $PCT% is below 85%"
            exit 1
          fi

      - name: Dependency audit (backend)
        shell: bash
        run: |
          FAILED=0
          for PROJECT in backend/SebPortal.Api/SebPortal.Api.csproj backend/SebPortal.Api.Tests/SebPortal.Api.Tests.csproj; do
            dotnet list "$PROJECT" package --vulnerable --include-transitive > audit.txt 2>&1
            cat audit.txt
            if grep -E -q "(High|Critical)" audit.txt; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "A package with a High or Critical vulnerability was found."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependency audit (frontend)
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high