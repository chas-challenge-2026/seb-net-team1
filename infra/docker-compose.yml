# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
version: "3.9"
name: seb

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: seb
      POSTGRES_USER: seb
      POSTGRES_PASSWORD: seb123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seb -d seb"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  app:
    build:
      context: ../backend/SebPortal
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8081"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=seb;Username=seb;Password=seb123"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
