# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
version: "3.9"
name: seb

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  native:
    build:
      context: ../native
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ../native:/workspace

  app:
    build:
      context: ..
      dockerfile: backend/SebPortal.Api/Dockerfile
    expose:
      - "8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8081"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in infra/.env before starting Docker}"
      Jwt__PreviousKey: "${JWT_PREVIOUS_KEY:-}"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in infra/.env};Username=${POSTGRES_USER:?Set POSTGRES_USER in infra/.env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
